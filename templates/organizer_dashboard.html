<!DOCTYPE html>
<html lang="en">
<head>
    {%load static%}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Tournament Finder</a>
      <div class="d-flex">
        <a href="" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Add Tournament Form -->
  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="mb-4 text-center text-primary">Add Tournament</h2>
      <form method="POST" >
     {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">Tournament Name</label>
          <input type="text" class="form-control" name="name" placeholder="Enter tournament name" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Category</label>
          <select class="form-select" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Football">Football</option>
            <option value="Cricket">Cricket</option>
            <option value="Badminton">Badminton</option>
            <option value="Chess">Chess</option>
          </select>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Start Date</label>
            <input type="date" class="form-control" name="start_date" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">End Date</label>
            <input type="date" class="form-control" name="end_date">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Registration Deadline</label>
            <input type="date" class="form-control" name="registration_deadline">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Location</label>
          <input type="text" class="form-control" name="location" placeholder="Enter location" required>
        </div>

          <div class="mb-3">
          <label class="form-label fw-bold">registration fees</label>
          <input type="text" class="form-control" name="fees" placeholder="Enter fees" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" name="description" rows="4" placeholder="Enter tournament details"></textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success btn-lg">Add Tournament</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
