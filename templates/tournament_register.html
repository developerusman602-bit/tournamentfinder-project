<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register for Tournament</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="text-center text-primary">Register for {{ tournament.name }}</h2>
      <p class="text-center">Fill in your team details below:</p>

      <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Team Name</label>
          <input type="text" name="team_name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Location</label>
          <input type="text" name="location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" required pattern="[0-9]{10}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
          <div class="mb-3">
          <label class="form-label">payment proof</label>
          <input type="file" name="proof" class="form-control" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
    </div>
  </div>

</body>
</html>
