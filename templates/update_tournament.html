<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Tournament</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Tournament Finder</a>
      <div class="d-flex">
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Update Tournament Form -->
  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="mb-4 text-center text-primary">Update Tournament</h2>
      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-bold">Tournament Name</label>
          <input type="text" class="form-control" name="name" value="{{ tournament.name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Category</label>
          <select class="form-select" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Football" {% if tournament.category == 'Football' %}selected{% endif %}>Football</option>
            <option value="Cricket" {% if tournament.category == 'Cricket' %}selected{% endif %}>Cricket</option>
            <option value="Badminton" {% if tournament.category == 'Badminton' %}selected{% endif %}>Badminton</option>
            <option value="Chess" {% if tournament.category == 'Chess' %}selected{% endif %}>Chess</option>
          </select>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Start Date</label>
            <input type="date" class="form-control" name="start_date" value="{{ tournament.start_date|date:'Y-m-d' }}" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">End Date</label>
            <input type="date" class="form-control" name="end_date" value="{{ tournament.end_date|date:'Y-m-d' }}">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Registration Deadline</label>
            <input type="date" class="form-control" name="registration_deadline" value="{{ tournament.registration_deadline|date:'Y-m-d' }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Location</label>
          <input type="text" class="form-control" name="location" value="{{ tournament.location }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Registration Fees</label>
          <input type="text" class="form-control" name="fees" value="{{ tournament.registration_fee }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" name="description" rows="4">{{ tournament.description }}</textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Update Tournament</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
