<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournaments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
<!--  <link href="static/css/styles.css" rel="stylesheet">-->
  <link rel="stylesheet" href="{% static 'css/project.css'%}">
  <link rel="stylesheet" href="{% static 'js/project.js'%}">
    <link rel="stylesheet" href="{% static 'js/tournament_filter.js'%}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="home.html">Tournament Finder</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="user_dashboard">User</a></li>
          <li class="nav-item"><a class="nav-link active" href="tournament/">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="organizer_dashboard/">Organizer</a></li>
          <li class="nav-item"><a class="nav-link" href="my_dashboard">My Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container section">
    <h2 class="mb-3">Browse Tournaments</h2>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <input id="searchText" class="form-control" placeholder="Search by name…" />
      </div>
      <div class="col-md-3">
        <select id="filterCategory" class="form-select">
          <option>All</option>
          <option>Cricket</option>
          <option>Football</option>
          <option>Badminton</option>
          <option>E-sports</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-md-3">
        <input id="filterCity" class="form-control" placeholder="City (e.g., Kochi)" />
      </div>
      <div class="col-md-2 d-flex align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filterUpcoming" checked>
          <label class="form-check-label" for="filterUpcoming">Upcoming only</label>
        </div>
      </div>
    </div>

    <div class="row g-3" id="tournamentList">
      <!-- Card 1 -->
      {% for x in data %}
      <div class="col-md-4 tournament-card" >
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{x.name}}</h5>
            <p><strong> Start Date:</strong>{{x.start_date}} </p>
            <p><strong> End Date:</strong>{{x.end_date}} </p>
            <p><strong>Location:</strong> {{x.location}}</p>
            <a href="/tournament_details/{{x.tournament_id}}" class="btn btn-primary">view Details</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
